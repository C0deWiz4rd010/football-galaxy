name: CI

# Quality gate for pull requests and main. Releases still run from release.yml on develop.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  proxy:
    # Both proxy implementations must pass the same contract (proxy/SPEC.md).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Node proxy contract
        run: node scripts/test-proxy.mjs

      - name: PHP proxy lint
        run: php -l deploy/hostinger/api/live.php

      - name: PHP proxy contract
        env:
          PROXY_TEST_NETWORK: '1'
        run: node scripts/test-proxy.mjs --php
