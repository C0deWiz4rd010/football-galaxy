<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Football Galaxy</title>
    <!-- The app replaces title and description per route (src/app/documentMeta.tsx). -->
    <meta name="description" content="Football Galaxy: Live-Tabellen, Spielpläne, Torjäger und Spielerstatistiken der Top-5-Ligen Europas plus das WM-2026-Archiv." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b111d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fa" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Football Galaxy" />
    <meta property="og:title" content="Football Galaxy" />
    <meta property="og:description" content="Live-Tabellen, Spielpläne, Torjäger und Spielerstatistiken der Top-5-Ligen Europas plus das WM-2026-Archiv." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Applies stored theme, palette and language before the first paint
         (no light/dark flash, correct lang for screen readers). Keys mirror
         next-themes ("theme"), PaletteContext and LocaleContext. -->
    <script>
      (function () {
        var root = document.documentElement
        var get = function (key) {
          try {
            return localStorage.getItem(key)
          } catch (e) {
            return null
          }
        }
        var theme = get('theme') === 'light' ? 'light' : 'dark'
        root.classList.add(theme)
        root.style.colorScheme = theme
        var palette = get('fg-palette')
        var palettes = ['galaxy', 'midnight', 'aurora', 'stadium', 'crimson', 'mono']
        root.setAttribute('data-palette', palettes.indexOf(palette) !== -1 ? palette : 'galaxy')
        root.lang = get('football-galaxy-locale') === 'en' ? 'en' : 'de'
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        Football Galaxy braucht JavaScript. · Football Galaxy needs JavaScript.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
