<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Football Galaxy</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('fg-palette')
          var valid = ['galaxy', 'midnight', 'aurora', 'stadium', 'crimson', 'mono']
          document.documentElement.setAttribute(
            'data-palette',
            valid.indexOf(p) !== -1 ? p : 'galaxy',
          )
        } catch (e) {
          document.documentElement.setAttribute('data-palette', 'galaxy')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
